[project]
name = "dcsplan-backend"
version = "0.0.0"
description = "FastAPI backend for DCS Plan"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosqlite",
  "cairosvg",
  "fastapi",
  "httpx",
  "httpx-oauth",
  "itsdangerous",
  "numpy",
  "pillow",
  "pycrdt",
  "pycrdt-websocket",
  "pyproj",
  "python-dotenv",
  "python-json-logger",
  "truststore",
  "uvicorn[standard]",
  "yoyo-migrations",
  "rich",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-watch", "requests"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pyright]
include = ["."]
exclude = ["**/__pycache__", "**/node_modules", ".venv", "venv"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingTypeStubs = false
reportUnusedImport = false
reportUnusedClass = false
reportUnusedFunction = false
reportUnusedVariable = false
